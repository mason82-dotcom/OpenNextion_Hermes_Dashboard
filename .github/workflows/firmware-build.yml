name: OpenNextion firmware compile
on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  workflow_dispatch:

jobs:
  compile-esp32s3:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32-S3 board support
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install firmware libraries
        run: |
          # Same versions as scripts/pi/setup-arduino-toolchain.sh.
          arduino-cli lib install "GFX Library for Arduino@1.6.9"
          arduino-cli lib install "Adafruit BusIO@1.17.4"
          arduino-cli lib install "Adafruit CST8XX Library@1.1.1"
          arduino-cli lib install "Adafruit PCF8574@1.1.2"
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli lib install "lvgl@8.3.11"

      # Safe default: no Config.h, hence HT_DEMO_MODE=1.
      # This build has no WiFi credentials and cannot call Hermes.
      - name: Compile credential-free display demo
        run: |
          test ! -f firmware/HermesTouch/Config.h
          arduino-cli compile \
            --clean \
            --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB' \
            --build-path "${{ runner.temp }}/hermes-display-demo" \
            firmware/HermesTouch

      # Compile both conditional code paths. This config deliberately contains
      # unusable placeholder values and is never uploaded or committed.
      - name: Compile connected branch with placeholder config
        run: |
          cp firmware/HermesTouch/Config.h.example firmware/HermesTouch/Config.h
          cp firmware/HermesTouch/LocalCa.h.example firmware/HermesTouch/LocalCa.h
          trap 'rm -f firmware/HermesTouch/Config.h firmware/HermesTouch/LocalCa.h' EXIT
          arduino-cli compile \
            --clean \
            --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB' \
            --build-path "${{ runner.temp }}/hermes-connected-build" \
            firmware/HermesTouch

      # The opt-in local audio and touch-calibration paths are otherwise never
      # compiled in CI. Placeholder values only; nothing is uploaded.
      - name: Compile connected branch with all local diagnostics enabled
        run: |
          sed -e 's/HT_MIC_TEST_ENABLED 0/HT_MIC_TEST_ENABLED 1/' \
              -e 's/HT_SPEAKER_TEST_ENABLED 0/HT_SPEAKER_TEST_ENABLED 1/' \
              -e 's/HT_TOUCH_CALIBRATION_ENABLED 0/HT_TOUCH_CALIBRATION_ENABLED 1/' \
              firmware/HermesTouch/Config.h.example > firmware/HermesTouch/Config.h
          cp firmware/HermesTouch/LocalCa.h.example firmware/HermesTouch/LocalCa.h
          trap 'rm -f firmware/HermesTouch/Config.h firmware/HermesTouch/LocalCa.h' EXIT
          test "$(grep -c 'ENABLED 1' firmware/HermesTouch/Config.h)" -eq 3
          arduino-cli compile \
            --clean \
            --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB' \
            --build-path "${{ runner.temp }}/hermes-all-diagnostics-build" \
            firmware/HermesTouch
